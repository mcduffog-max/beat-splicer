name: Build the Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: node build.mjs
      - run: npx cap sync android
      - name: Build the APK (the runner already has the Android SDK)
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../beat-splicer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: beat-splicer-apk
          path: beat-splicer.apk
      - name: Publish as the latest Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Beat Splicer for Android (latest)
          body: |
            Install on your phone: open this page on the phone, tap beat-splicer.apk, then allow installs from your browser when Android asks.
            Built from ${{ github.sha }}.
          files: beat-splicer.apk
          prerelease: false
          make_latest: true
