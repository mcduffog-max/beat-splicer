name: Build the Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: node build.mjs
      - run: npx cap sync android
      - name: Build the APK (the runner already has the Android SDK)
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../beat-splicer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: beat-splicer-apk
          path: beat-splicer.apk
      - name: Publish as the latest Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Beat Splicer for Android (build ${{ github.run_number }})
          body: |
            Install on your phone: open this page on the phone, tap beat-splicer.apk, then allow installs from your browser when Android asks.
            Build: ${{ github.run_number }}
            Built from ${{ github.sha }}.
          files: beat-splicer.apk
          prerelease: false
          make_latest: true
  store:
    # the Play Store build (tiers on, signed with your upload key); runs once the two secrets exist
    runs-on: ubuntu-latest
    steps:
      - name: Check for the upload key
        id: key
        env:
          K: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$K" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "No upload key yet - add UPLOAD_KEYSTORE_B64 and UPLOAD_PASSWORD as repository secrets"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == '1'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == '1'
        with:
          distribution: temurin
          java-version: 21
      - name: Build the Play Store bundle
        if: steps.key.outputs.ok == '1'
        env:
          K: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "$K" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          npm ci --no-audit --no-fund
          BS_STORE=1 node build.mjs
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/bundle/release/app-release.aab ../beat-splicer-play.aab
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == '1'
        with:
          name: beat-splicer-play-bundle
          path: beat-splicer-play.aab
